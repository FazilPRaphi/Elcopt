{% extends "base.html" %}

{% block title %}Register | Elcopt{% endblock %}

{% block content %}
<div class="container auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <h2>Create Account</h2>
            <p>Join Elcopt today and start storing your images effortlessly.</p>
        </div>

        <form method="POST" action="/register">
            <div class="form-group">
                <label for="username" class="form-label">Username</label>
                <div class="input-wrapper">
                    <input type="text" id="username" name="username" class="form-input" placeholder="Choose a username"
                        required autocomplete="username">
                    <i class="fa-solid fa-user input-icon"></i>
                </div>
            </div>

            <div class="form-group">
                <label for="email" class="form-label">Email Address</label>
                <div class="input-wrapper">
                    <input type="email" id="email" name="email" class="form-input" placeholder="name@example.com"
                        required autocomplete="email">
                    <i class="fa-solid fa-envelope input-icon"></i>
                </div>
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <div class="input-wrapper">
                    <input type="password" id="password" name="password" class="form-input"
                        placeholder="Create a password (min 6 chars)" minlength="6" required
                        autocomplete="new-password">
                    <i class="fa-solid fa-lock input-icon"></i>
                </div>
            </div>



            <button type="submit" class="btn btn-primary btn-block btn-lg">
                <i class="fa-solid fa-user-plus"></i> Create Account
            </button>
        </form>

        <div class="auth-footer-link">
            Already have an account?
            <a href="{{ url_for('login') }}">Sign In</a>
        </div>
    </div>
</div>
{% endblock %}
